name: PR 규칙
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
# 리뷰가 연달아 달려도 마지막 판정만 남긴다
concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 판정 결과는 커밋 상태(형식 검사·승인 검사)로 기록한다.
# 커밋 상태는 이름이 같으면 마지막 값으로 교체되므로, 리뷰가 늘면 ❌가 ✅로 바뀐다.
# (검사 실행 결과로 실패시키면 옛 ❌가 남아 머지를 계속 막는다.)
jobs:
  judge:
    name: PR 규칙 판정
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr.head.ref;

            // ── 형식 검사 ──
            const errs = [];
            // 브랜치: feat|fix/{계층}-{요약}, decision|docs/{요약}
            const m = head.match(/^(feat|fix|decision|docs)\/([a-z0-9]+(?:-[a-z0-9]+)*)$/);
            if (!m) errs.push(`브랜치 '${head}'가 feat|fix|decision|docs/{slug} 형식이 아님`);
            else if (['feat', 'fix'].includes(m[1]) && !/^(api|core|db|iot|shared|app|dashboard|firmware)-/.test(m[2]))
              errs.push(`slug '${m[2]}'가 {계층}-{요약} 형식이 아님`);
            // PR 제목: 타입(계층): 요약
            if (!/^(feat|fix|decision|docs|test|refactor|chore)(\((api|core|db|iot|shared|app|dashboard|firmware)\))?: \S/.test(pr.title))
              errs.push(`PR 제목이 '타입(계층): 요약' 형식이 아님`);
            // decision PR: 본문에 Closes #이슈번호
            if (m && m[1] === 'decision' && !/\bcloses\s+#\d+/i.test(pr.body || ''))
              errs.push(`decision PR 본문에 'Closes #이슈번호'가 없음`);

            // ── 승인 검사 ──
            // 모든 PR은 작성자 외 3인 승인이 필요하다
            const need = 3;
            // 작성자를 뺀 리뷰어별 마지막 리뷰 상태
            const reviews = await github.paginate(github.rest.pulls.listReviews,
              { ...context.repo, pull_number: pr.number });
            const last = {};
            for (const r of reviews) {
              if (r.user.login === pr.user.login) continue;
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) last[r.user.login] = r.state;
            }
            const approved = Object.keys(last).filter(u => last[u] === 'APPROVED');
            const blocked = Object.keys(last).filter(u => last[u] === 'CHANGES_REQUESTED');
            let ok = true, msg = `승인 ${approved.length}/${need}명`;
            if (approved.length < need) ok = false;
            else if (blocked.length) { ok = false; msg = `변경 요청 남음: ${blocked.join(', ')}`; }

            // ── 커밋 상태로 기록 ──
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const post = (name, pass, text) => github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, context: name,
              state: pass ? 'success' : 'failure', description: text.slice(0, 140), target_url: url });
            await post('형식 검사', !errs.length, errs.length ? errs.join(' / ') : '형식 통과');
            await post('승인 검사', ok, msg);
            core.info(`형식: ${errs.join(' / ') || '통과'}`);
            core.info(`승인: ${msg}`);
