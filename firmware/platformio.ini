; NearPilot node firmware shared by every device type.
; lib/ holds Arduino-free modules; the same Unity tests run on the ESP32 and on a PC.
[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
test_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@7.4.2
build_flags = -Wall -Wextra

; light-1: GPIO23 stays HIGH for on and LOW for off. Boot starts LOW.
; Device identity and credentials still come from the existing NVS configuration.
[env:esp32dev-light-1]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D NP_OUTPUT_PIN=23
    -D NP_OUTPUT_ACTIVE_HIGH=true

; locker-1: servo on GPIO13. Boot holds 0 degrees; open turns to 90 and relocks after 3 s.
; Device identity and credentials still come from the existing NVS configuration.
[env:esp32dev-locker-1]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D NP_SERVO_PIN=13

; Needs a host C++ compiler (for example MinGW-w64 on Windows).
[env:native]
platform = native@1.2.1
lib_deps =
    bblanchon/ArduinoJson@7.4.2
lib_ignore = np_nvs
test_ignore = test_esp32_*
build_flags = -std=gnu++17 -Wall -Wextra
