; NearPilot node firmware shared by every device type.
; lib/ holds Arduino-free modules; the same Unity tests run on the ESP32 and on a PC.
[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
test_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@7.4.2
build_flags = -Wall -Wextra

; Needs a host C++ compiler (for example MinGW-w64 on Windows).
[env:native]
platform = native@1.2.1
lib_deps =
    bblanchon/ArduinoJson@7.4.2
lib_ignore = np_nvs
test_ignore = test_esp32_*, test_check_storage
build_flags = -std=gnu++17 -Wall -Wextra
