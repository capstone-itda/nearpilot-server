; NearPilot node firmware shared by every device type.
; lib/ holds Arduino-free modules; the same Unity tests run on the ESP32 and on a PC.
[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
test_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@7.4.2
build_flags = -Wall -Wextra

; Each profile builds in one device declaration (lib/np_descriptor/np_descriptors.h, #245). The plain esp32dev
; profile has serial output only and declares a light without arguments; set -D NP_DESCRIPTOR to change it.

; light-1: WS2812B ring (16 LEDs) on GPIO18. on lights it white, off clears it. Boot starts off.
; Declares brightness 0..64 and color. Identity and credentials come from the existing NVS configuration.
[env:esp32dev-light-1]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    ${env:esp32dev.build_flags}
    -D NP_LIGHT_RING_PIN=18
    -D NP_DESCRIPTOR=np::LIGHT_RING_DESCRIPTOR

; locker-1: servo on GPIO13. Boot holds 0 degrees; open turns to 90 and close back to 0.
; WS2812B stick (8 LEDs) on GPIO19 shows the server's occupancy display: blue free, red occupied.
; Declares open and close (re-operation). Identity and credentials come from the existing NVS configuration.
[env:esp32dev-locker-1]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    ${env:esp32dev.build_flags}
    -D NP_SERVO_PIN=13
    -D NP_LED_PIN=19
    -D NP_DESCRIPTOR=np::LOCKER_DESCRIPTOR

; speaker-1: DFPlayer Mini on UART2 (GPIO17 TX through 1 kOhm, GPIO16 RX). Boot stops playback;
; on loops SD folder 01 until off. Declares volume 0..20. Identity and credentials come from the existing NVS
; configuration.
[env:esp32dev-speaker-1]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D NP_SPEAKER_TX_PIN=17
    -D NP_SPEAKER_RX_PIN=16
    -D NP_DESCRIPTOR=np::SPEAKER_DFPLAYER_DESCRIPTOR

; Needs a host C++ compiler (for example MinGW-w64 on Windows).
[env:native]
platform = native@1.2.1
lib_deps =
    bblanchon/ArduinoJson@7.4.2
lib_ignore = np_nvs
test_ignore = test_esp32_*
build_flags = -std=gnu++17 -Wall -Wextra
