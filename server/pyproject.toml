[project]
name = "nearpilot"
version = "0.1.0"
description = "NearPilot server: MCP/REST/WebSocket API, decision core, SQLite storage, MQTT gateway"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "fastapi",
    "uvicorn[standard]",
    "paho-mqtt>=2",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nearpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
