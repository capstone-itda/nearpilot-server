# 좌표표 예시. 평가 도구만 읽는다 (nearpilot evaluate-order --layout example.toml). 지표 10(거리 순서)의 정답 순서를 정한다.
# 서버, 공통 모델 파일, 수집 도구는 좌표를 읽지 않는다.
# 좌표는 [x, y]이고 단위는 m다. 기기와 서는 위치가 같은 좌표계에 있으면 원점과 축은 어디든 괜찮다.
# spot 이름은 수집 계획의 spot과 글자까지 같아야 한다 (config/plans/). 모르는 키는 오류다.
# 아래 값은 예시다. 실제 수집 장소에서 잰 위치로 바꾼다.

place_id = "place-a"    # 분할 결과의 장소와 같아야 한다

# 기기 ID → 좌표. 회차에 나온 기기는 모두 적어야 한다.
[nodes]
"locker-1" = [0.0, 0.0]
"locker-2" = [3.0, 0.0]

# 서는 위치 → 좌표. 회차 기록의 spot은 모두 적어야 한다.
[spots]
"locker-1 앞 위치, 손에 들고 화면 위" = [0.0, 0.6]
"locker-2 앞 위치, 손에 들고 화면 위" = [3.0, 0.6]
"두 기기에서 먼 곳" = [1.5, 5.0]
