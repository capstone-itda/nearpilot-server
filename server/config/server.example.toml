# NearPilot 서버 설정 예시. config/server.toml 로 복사해서 배포 값을 채운다.
# 실행: server/ 에서 nearpilot serve (또는 python -m nearpilot --config config/server.toml)
# 상대 경로는 이 파일이 있는 디렉터리 기준이다. 알 수 없는 키는 시작을 막는다.
# 비밀 원문을 이 파일에 쓰지 않는다. 비밀은 파일 경로로만 넣는다.
# 설정 변경은 재시작으로 적용한다. 기존 요청과 점유는 저장한 설정 스냅샷을 유지한다.

# 운영 수치 (nearpilot.shared.config.Settings). version 만 필수다.
# 빠진 키는 Settings 의 시연용 초기값을 쓴다. 미설정 임계값(None)은 TOML 에 쓰지 않는다.
# threshold_speaker 는 담당 검증 전까지 비워 둔다. 비우면 스피커의 근접 지정 실행을 허가하지 않는다.
# 명시 지정은 장소의 비콘 수신을 확인하고 기기별 근접 확률 검사를 생략한다.
[settings]
version = "demo-1"
threshold_locker = 0.95
threshold_light = 0.75
retention_cleanup_interval_sec = 60
# 새 종류(kind)를 붙이면 threshold_{kind} 를 추가한다. 없으면 그 종류는 명시 지정으로만 쓴다 (FR-17, #245).
# 전역 할당(any:{kind})을 받는 종류다 (FR-23).
any_allowed_kinds = ["locker"]

# 동작 인자의 서버 상한 param_max.{kind}.{action}.{arg} 다 (FR-09). 기기 선언의 maximum 과 비교해서 작은 값을 쓴다.
# 표를 쓰면 기본값 전체를 대신한다. 쓰지 않은 종류·동작·인자에는 상한이 없다.
# 64 는 light-1 의 보드 5V 전원에서 흰색 점등을 확인한 값이다. 전류 측정 전에는 올리지 않는다.
# 20 은 커패시터 없는 speaker-1 에서 담당자가 정한 값이다. 커패시터를 달기 전에는 올리지 않는다.
[settings.param_max.light.on]
brightness = 64
[settings.param_max.speaker.on]
volume = 20

# 생략한 인자의 기본값 param_default.{kind}.{action}.{arg} 다. 같은 동작의 앞선 성공 명령이 없을 때 쓴다 (FR-09).
# 표를 쓰면 기본값 전체를 대신한다.
[settings.param_default.light.on]
brightness = 64
color = "#FFFFFF"
[settings.param_default.speaker.on]
volume = 20

# runtime 실행 설정. 모두 선택이며 아래 값이 초기값이다.
# 호출 주기는 도메인 응답 기한(Settings)과 다른 값이다.
[runtime]
sqlite_busy_timeout_ms = 5000
shutdown_timeout_sec = 30.0
execution_tick_sec = 0.25
release_tick_sec = 0.25
restore_tick_sec = 0.25
recovery_tick_sec = 0.25
shared_light_tick_sec = 1.0
occupancy_tick_sec = 1.0

[http]
host = "127.0.0.1"
port = 8000

[database]
path = "../var/nearpilot.db"
audit_jsonl = "../var/audit.jsonl"

# 장소별 모델 버전을 명시한다. 파일은 <model_root>/<place_id>/<model_version>.json 이다.
[proximity]
model_root = "../var/models"

[proximity.models]
place-a = "replace-with-model-version"

# MQTT 서버 계정. 모든 키가 필수이고 기본값이 없다.
# password_file 은 원문 비밀번호 한 줄 파일이다 (.env.* 는 커밋하지 않는다).
[mqtt]
host = "127.0.0.1"
port = 1883
client_id = "nearpilot-server"
username = "nearpilot-server"
password_file = ".env.mqtt-password"
keepalive_sec = 30
connect_timeout_sec = 5.0
start_timeout_sec = 10.0
stop_timeout_sec = 5.0
reconnect_min_sec = 1
reconnect_max_sec = 8

# 보고 검증·인계. 모든 키가 필수이고 기본값이 없다.
[delivery]
# 실제 기기는 MQTT 시각 요청·응답으로 서버 시각에 맞춘다 (#236). 모든 기기와 시뮬레이터에 같은 값을 쓴다.
clock_max_error_sec = 0.5  # 최대 시각 오차(초). 기기는 왕복 시간의 절반이 이보다 크면 응답을 버린다
clock_trust_sec = 120      # 기기가 동기화 뒤 시각을 신뢰하는 기간(초). 15~86400
clock_resync_sec = 60      # 기기가 다시 맞추는 간격(초). 5 이상, clock_trust_sec 이하
pending_limit = 1000
retry_interval_sec = 0.5
stop_timeout_sec = 5.0

# 대시보드 (선택). 이 섹션이 있으면 소유자 토큰으로 모니터링 WebSocket(/dashboard/stream)과
# 조회 REST(/dashboard/...)를 연다. 없으면 대시보드를 열지 않고 서버의 다른 동작은 같다.
# 키 6개가 모두 필수이고 기본값이 없다. 값은 시연용 초기값이다.
[dashboard]
queue_max_events = 1000  # 연결마다 쌓아 둘 수 있는 이벤트 수. 넘으면 그 연결을 닫고 대시보드가 다시 연결한다
batch_max_events = 50    # WebSocket 메시지 하나에 담는 이벤트 수
auth_timeout_sec = 5.0   # 연결한 뒤 인증 메시지를 기다리는 시간
audit_limit_max = 200    # 감사 조회 한 번의 최대 행 수
weak_rssi_dbm = -80      # 장소 목록의 weakRssiDbm. 대시보드 배치 화면이 이보다 약한 수신을 약한 신호로 그린다
tail_interval_sec = 0.5  # 따라 읽기 간격. 사건이 화면에 보이기까지 최대 이만큼 늦다

# 기기 접속 설정 (선택, #234). 이 섹션이 있으면 소유자 앱이 GET /admin/nodes/{node_id}/provisioning 으로
# 기기 접속 설정 묶음을 받아 BLE로 기기에 넣고, 서버는 <mdns_name>.local 을 mdns_address 로 알린다.
# 없으면 둘 다 하지 않는다. 기기 비밀번호는 기기 목록 옆의 .env.<node_id> 파일(또는 목록의 password_file)이다.
# [provisioning]
# fleet = "fleet.json"            # 기기 목록 파일 (nearpilot provision 과 같은 형식)
# mdns_name = "nearpilot"         # 기기는 nearpilot.local 로 접속한다
# mdns_address = "192.168.0.10"   # 기기가 접속할 이 PC의 IPv4 주소

