# Run from server/: mosquitto -c config/mosquitto.conf
# Replace the listener address with the server's independent-AP address before
# accepting devices. This checked-in example only listens on localhost.
listener 1883 127.0.0.1
allow_anonymous false
password_file config/.env.mosquitto-passwords
acl_file config/mosquitto.acl.example
persistence false
connection_messages false
log_type error
log_type warning
