# 기기 발표를 받은 뒤 기존 nearpilot seed로 반영한다.
# 최초 등록의 토큰은 화면에 한 번만 나온다. 이미 있는 계정은 유지한다.
[[accounts]]
user_id = "demo-owner"
name = "시연 소유자"
role = "owner"

[[accounts]]
